<style>
/* ===== Yusuf's AI Dojo — base styles (every world overrides the tokens) ===== */
:root{
  --bg:#f6f3ec; --bg2:#ece6d8; --ink:#1d1d1f; --muted:#55524b; --card:#ffffff; --line:#1d1d1f22;
  --accent:#d62828; --accent-ink:#ffffff; --accent2:#1d3557; --good:#1b7f4b; --good-bg:#e3f6ea; --bad:#b3261e; --bad-bg:#fde7e4;
  --radius:18px; --shadow:0 6px 0 #1d1d1f18, 0 12px 30px #1d1d1f14;
  --font-head: "Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-body: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --head-weight:800; --head-case:none; --head-track:0;
  --sensei:#e9eef5; --band:#d62828;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important} }
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--font-body);min-height:100vh;overflow-x:hidden}
img,svg{max-width:100%}
a{color:var(--accent2);text-underline-offset:3px}
h1,h2,h3{font-family:var(--font-head);font-weight:var(--head-weight);text-transform:var(--head-case);letter-spacing:var(--head-track);line-height:1.15;margin:0 0 .5em}
h1{font-size:clamp(1.9rem,6vw,3rem)} h2{font-size:clamp(1.35rem,4vw,1.8rem)} h3{font-size:1.15rem}
p{margin:0 0 .8em}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--accent2);outline-offset:3px;border-radius:6px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
noscript p{background:#fff3cd;color:#1d1d1f;padding:12px 16px;border-radius:12px}

/* ---- top bar ---- */
#dojo-bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);color:var(--ink);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);flex-wrap:wrap}
#dojo-bar a,#dojo-bar button{min-height:44px}
.db-home{display:inline-flex;align-items:center;gap:6px;font-weight:800;text-decoration:none;color:var(--ink);padding:0 12px;border-radius:999px;background:var(--card);border:2px solid var(--line)}
.db-me{display:inline-flex;align-items:center;gap:6px;font-weight:700;margin-right:auto;min-width:0}
.db-nick{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9.5em}
.db-av{font-size:1.5rem}
.db-pill{display:inline-flex;align-items:center;gap:4px;padding:0 12px;min-height:44px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:800;color:var(--ink);text-decoration:none}
.db-sound{font-size:1.2rem;width:44px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer}
@media (max-width:480px){ #dojo-bar{flex-wrap:nowrap;gap:6px;padding:8px} .db-home span:last-child,.db-xp>span[aria-hidden]:last-child{display:none} .db-home{padding:0 10px} .db-pill{padding:0 10px} .db-nick{max-width:5.5em} .db-av{font-size:1.3rem} }

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:700 1rem/1.2 var(--font-body);cursor:pointer;text-decoration:none;box-shadow:0 4px 0 var(--ink);transition:transform .08s, box-shadow .08s;touch-action:manipulation}
.btn:hover{transform:translateY(-1px)} .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:40px;padding:6px 14px;font-size:.92rem}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---- hero ---- */
.hero{position:relative;padding:28px 0 18px}
.hero .kicker{display:inline-block;font-weight:800;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);margin-bottom:10px}
.hero .hook{font-size:1.12rem;color:var(--muted);max-width:40em}
.hero-art{font-size:3.4rem;line-height:1;margin-bottom:6px}
.steps{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:14px 0 0;list-style:none}
.steps li{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--card);color:var(--ink);border:2px solid var(--line);font-weight:700;font-size:.9rem}
.steps .ck{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);font-size:.8rem}
.steps li.on .ck{background:var(--good);color:#fff;border-color:var(--good)}
.nudge{background:var(--card);border:2px dashed var(--accent);border-radius:14px;padding:10px 14px;margin:10px 0 0}

/* ---- section cards ---- */
.card,details.challenge{scroll-margin-top:76px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 18px;margin:18px 0;border:2px solid var(--line);position:relative}
@media (min-width:640px){ .card{padding:28px} }
.sec-title{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-title .ico{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:1.3rem;flex:none}
.sec-title h2{margin:0}
.instructions{background:var(--bg2);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600}

/* ---- story ---- */
.st-line{display:flex;gap:10px;align-items:flex-end;margin:0 0 12px}
.st-you{flex-direction:row-reverse}
.st-face{flex:none;width:50px;height:50px;display:grid;place-items:center;border-radius:50%;background:var(--bg2);font-size:1.8rem}
.st-bubble{background:var(--bg2);padding:10px 14px;border-radius:16px 16px 16px 4px;max-width:78%}
.st-you .st-bubble{background:var(--accent);color:var(--accent-ink);border-radius:16px 16px 4px 16px}
.st-name{display:block;font-size:.78rem;font-weight:800;opacity:.75;text-transform:uppercase;letter-spacing:.05em}
.st-narr{font-style:italic;color:var(--muted);text-align:center;margin:6px 0 14px}

/* ---- quiz ---- */
#quiz-sec:not(.ready) .quiz-hint{display:block}
.quiz-hint{display:none;font-size:.9rem;color:var(--muted)}
.qz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-weight:700;color:var(--muted);font-size:.9rem}
.qz-dots{display:flex;gap:5px}
.qz-dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.qz-dot.done{background:var(--good)} .qz-dot.now{background:var(--accent)}
.qz-q{font-size:1.2rem;font-weight:700}
.qz-choices{display:grid;gap:10px}
.qz-choice{text-align:left;min-height:52px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg2);color:var(--ink);font:600 1rem/1.35 var(--font-body);cursor:pointer}
.qz-choice:hover:not(:disabled){border-color:var(--accent)}
.qz-choice.right{background:var(--good-bg);border-color:var(--good);color:#0d3b22}
.qz-choice.right::after{content:"  ✓";font-weight:900}
.qz-choice.wrong{background:var(--bad-bg);border-color:var(--bad);color:#5c130e}
.qz-choice:disabled{cursor:default}
.qz-feedback{margin-top:12px}
.qz-feedback p{padding:12px 14px;border-radius:12px}
.qz-feedback.ok p{background:var(--good-bg);color:#0d3b22} .qz-feedback.no p{background:var(--bad-bg);color:#5c130e}
.qz-resume{font-size:.9rem;font-weight:700;color:var(--accent2);margin:0 0 6px}
.saved-note{display:inline-block;font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--good-bg);color:#0d3b22;margin:0 0 10px}
.qz-end{text-align:center;padding:10px}
.qz-stars{font-size:2.4rem} .qz-score{font-size:1.4rem}

/* ---- challenge ---- */
details.challenge{border:3px solid var(--ink);border-radius:var(--radius);background:repeating-linear-gradient(135deg,var(--card) 0 18px,var(--bg2) 18px 20px);margin:18px 0;box-shadow:var(--shadow)}
details.challenge>summary{color:var(--ink);list-style:none;cursor:pointer;padding:18px;display:flex;align-items:center;gap:12px;font:800 1.2rem/1.2 var(--font-head);min-height:56px}
details.challenge>summary::-webkit-details-marker{display:none}
details.challenge>summary .flame{font-size:1.8rem}
details.challenge>summary .tag{margin-left:auto;font:700 .8rem var(--font-body);padding:4px 10px;border-radius:999px;background:var(--ink);color:var(--card);white-space:nowrap}
details.challenge[open]>summary .tag::after{content:" ▲"} details.challenge:not([open])>summary .tag::after{content:" ▼"}
.challenge-body{padding:0 18px 20px;background:transparent}
.challenge-body>div{background:var(--card);border-radius:14px;padding:16px;border:2px solid var(--line)}

/* ---- key term ---- */
.term{display:flex;gap:14px;align-items:flex-start}
.term .scroll{font-size:2.2rem}
.term dt{font:800 1.3rem/1.2 var(--font-head)} .term dd{margin:4px 0 0}

/* ---- complete banner + nav ---- */
.complete{text-align:center;background:var(--good-bg);border-color:var(--good);color:#0d3b22}
.complete h2{color:#0d3b22}
.lesson-nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:24px 0 40px}
footer.site{padding:26px 0 40px;color:var(--muted);font-size:.85rem;text-align:center}
footer.site a{color:inherit}

/* ---- toasts ---- */
.toasts{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:#1d1d1f;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:0 8px 24px #0005;animation:toastIn .3s ease-out;text-align:center}
.toast.badge{background:linear-gradient(90deg,#7b2ff7,#d62828);}
.toast.xp{background:#1b7f4b}
.toast.out{opacity:0;transform:translateY(8px);transition:.35s}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---- confetti ---- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 3s ease-in forwards;opacity:.95}
@keyframes fall{to{top:105vh;transform:translateX(40px) rotate(540deg)}}

/* ---- ceremony ---- */
.ceremony{position:fixed;inset:0;z-index:250;background:#0b0b10e6;display:grid;place-items:center;padding:16px;animation:toastIn .4s}
.cer-card{background:#fffdf7;color:#1d1d1f;border-radius:24px;padding:26px 20px;max-width:480px;width:100%;text-align:center;border:4px solid #1d1d1f;box-shadow:0 20px 60px #0008}
.cer-belt{width:240px;height:120px}
.cer-l{animation:slideL 1s ease-out both} .cer-r{animation:slideR 1s ease-out both}
.cer-knot{animation:pop .5s .9s ease-out both;transform-origin:120px 58px} .cer-tail1,.cer-tail2{animation:drop .6s 1.2s ease-out both}
@keyframes slideL{from{transform:translateX(-60px);opacity:0}} @keyframes slideR{from{transform:translateX(60px);opacity:0}}
@keyframes pop{from{transform:scale(0)}} @keyframes drop{from{opacity:0;transform:translateY(-14px)}}
.cer-kicker{text-transform:uppercase;letter-spacing:.2em;font-weight:800;color:#8a6d1a;margin:6px 0}
.cer-card h2{font-size:1.6rem}

/* ---- generic interactive helpers used by activities ---- */
.so{display:grid;gap:10px}
.so-item{padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--bg2)}
.so-item p{margin:0 0 8px;font-weight:700}
.so-item .row button{flex:1 1 auto;min-width:84px}
.so-item.ok{border-color:var(--good)} .so-item.no{border-color:var(--bad)}
.so-item .so-right{outline:3px solid var(--good);outline-offset:1px}
.so-why{font-size:.93rem;margin-top:6px}
.tap{min-height:48px;min-width:48px;cursor:pointer;touch-action:manipulation}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--bg2);font-weight:700;font-size:.85rem}
.meter{height:14px;border-radius:999px;background:var(--bg2);overflow:hidden;border:2px solid var(--line)}
.meter>i{display:block;height:100%;background:var(--accent);width:0;transition:width .5s}
.feedback{min-height:1.5em;font-weight:700;margin-top:10px}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.err{color:var(--bad);font-weight:700}
.grid2{display:grid;gap:14px} @media (min-width:640px){ .grid2{grid-template-columns:1fr 1fr} }

@media print{
  #dojo-bar,.toasts,.confetti,.no-print{display:none!important}
  body{background:#fff!important;color:#000!important}
}



body{--bg:#fff4e6;--bg2:#ffe3c2;--accent:#f76707;--accent2:#c2410c;background:linear-gradient(180deg,#ffd8a8,#fff4e6 320px)}
.dl-sun{font-size:3.6rem;animation:rise 2s ease-out both}@keyframes rise{from{transform:translateY(30px);opacity:0}}
.dl-stats{display:flex;gap:8px;flex-wrap:wrap}
.dl-stats .pill{font-size:1rem;padding:6px 14px;background:#fff;border:2px solid var(--line)}
.dl-wisdom p{font-size:1.1rem}
.dl-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dl-day{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:.8rem;font-weight:800;background:var(--bg2);color:#7c2d12}
.dl-day.on{background:#f76707;color:#fff}
.dl-day.today{outline:3px solid #7c2d12}

</style>
</head>

<script>
window.CURRIC={"worlds":[{"id":"white","name":"White Belt","world":"What Is AI?","color":"#f4f1ea","ink":"#1d1d1f","emoji":"🥋","blurb":"What AI really is, where it hides in your day, and where the word \"algorithm\" came from.","built":true,"lessons":[{"id":"rules-vs-learning","title":"Rules vs Learning","emoji":"🤖","min":12,"term":"Machine Learning","def":"When a computer finds patterns in examples, instead of only following rules a person wrote."},{"id":"ai-all-around","title":"AI All Around You","emoji":"📱","min":10,"term":"Artificial Intelligence (AI)","def":"Computer systems that do tasks that usually need human smarts — like recognizing, predicting, deciding, or creating."},{"id":"is-it-ai","title":"Is It AI?","emoji":"🗂️","min":10,"term":"Automation","def":"A machine doing a job by itself. Automatic is not the same as intelligent — a timer is automatic, but it is not AI."},{"id":"al-khwarizmi","title":"The Algorithm Scholar","emoji":"📜","min":15,"term":"Algorithm","def":"A precise, step-by-step set of instructions for solving a problem."},{"id":"turing-test","title":"You Be the Judge","emoji":"🕵️","min":12,"term":"Turing Test","def":"A test where a judge chats with a hidden human and a hidden machine and tries to tell which is which."},{"id":"ai-myths","title":"Myth Busters","emoji":"💥","min":10,"term":"Hype","def":"Claims that make something sound more amazing — or scarier — than it really is."}]},{"id":"yellow","name":"Yellow Belt","world":"Data Is Power","color":"#ffd23f","ink":"#1d1d1f","emoji":"📊","blurb":"Data is the fuel of AI. Collect it, label it, chart it, and learn why bad data makes bad AI.","built":true,"lessons":[{"id":"what-is-data","title":"What Is Data?","emoji":"🔢","min":10,"term":"Data","def":"Facts, numbers, words, pictures or sounds collected so they can be studied."},{"id":"collect-and-label","title":"Collect & Label","emoji":"🏷️","min":12,"term":"Label","def":"The correct answer attached to an example, like tagging a photo \"cat\". AI learns from labeled examples."},{"id":"stats-court","title":"Stats Court","emoji":"🏀","min":15,"term":"Correlation","def":"When two things tend to change together. It does NOT prove that one causes the other."},{"id":"averages-and-patterns","title":"Averages & Patterns","emoji":"📈","min":12,"term":"Average (Mean)","def":"Add up all the numbers, then divide by how many numbers there are."},{"id":"garbage-in-garbage-out","title":"Garbage In, Garbage Out","emoji":"🗑️","min":12,"term":"Garbage In, Garbage Out","def":"If the data going into a system is bad, the results coming out will be bad too."},{"id":"data-detective","title":"Data Detective","emoji":"🔍","min":12,"term":"Outlier","def":"A data point that is very different from the rest. It might be a mistake — or something really interesting."}]},{"id":"orange","name":"Orange Belt","world":"How Machines Learn","color":"#ff8c42","ink":"#1d1d1f","emoji":"⚙️","blurb":"Train your own classifier, test it fairly, and learn the difference between memorizing and understanding.","built":true,"lessons":[{"id":"train-a-classifier","title":"Train a Classifier","emoji":"🧺","min":15,"term":"Classifier","def":"A model that sorts things into groups (classes), like \"spam\" or \"not spam\"."},{"id":"train-vs-test","title":"Training vs Testing","emoji":"📝","min":12,"term":"Test Set","def":"Examples kept hidden during training, used afterward to check whether the model really learned."},{"id":"accuracy-score","title":"Accuracy Score","emoji":"🎯","min":10,"term":"Accuracy","def":"The share of answers a model gets right. 45 right out of 50 is 90% accuracy."},{"id":"overfitting","title":"Memorize or Understand?","emoji":"🧠","min":15,"term":"Overfitting","def":"When a model memorizes its training examples so closely that it fails on new ones."},{"id":"decision-trees","title":"Decision Trees","emoji":"🌳","min":15,"term":"Decision Tree","def":"A model that makes a decision by asking a series of yes/no questions."},{"id":"nearest-neighbor","title":"Nearest Neighbor","emoji":"📍","min":12,"term":"Nearest Neighbor","def":"A method that labels a new example by copying the label of the most similar examples it already knows."}]},{"id":"green","name":"Green Belt","world":"Inside the AI Brain","color":"#2ec27e","ink":"#0d2b1d","emoji":"🧠","blurb":"Neurons, weights, and networks — and how a computer \"learns\" by walking downhill.","built":true,"lessons":[{"id":"meet-the-neuron","title":"Meet the Neuron","emoji":"⚡","min":12,"term":"Artificial Neuron","def":"A tiny math unit: it multiplies inputs by weights, adds them up, and decides how strongly to \"fire\"."},{"id":"weights-and-bias","title":"Weights & Bias","emoji":"🎚️","min":15,"term":"Weight","def":"A number that sets how much one input matters. Training adjusts weights."},{"id":"activation-switch","title":"The Activation Switch","emoji":"🔌","min":12,"term":"Activation Function","def":"The rule a neuron uses to turn its total into an output, like \"fire only if the total is above zero\"."},{"id":"network-playground","title":"Network Playground","emoji":"🕸️","min":15,"term":"Neural Network","def":"Many artificial neurons connected in layers, passing numbers forward."},{"id":"walking-downhill","title":"Walking Downhill","emoji":"⛰️","min":15,"term":"Gradient Descent","def":"A way to improve a model by taking small steps in the direction that reduces error the fastest."},{"id":"how-networks-learn","title":"How Networks Learn","emoji":"🔁","min":15,"term":"Loss","def":"A score for how wrong a model's guesses are. Training tries to make the loss smaller."}]},{"id":"blue","name":"Blue Belt","world":"AI Senses","color":"#3a86ff","ink":"#0a1a33","emoji":"👁️","blurb":"How computers see and hear: pixels, colors, filters, edges, and sound turned into numbers.","built":true,"lessons":[{"id":"pixels","title":"Pixel Zoom","emoji":"🔬","min":10,"term":"Pixel","def":"One tiny square of color. Digital images are grids of pixels, and each pixel is stored as numbers."},{"id":"co   }
  function L(id) { if (!st.lessons[id]) st.lessons[id] = {}; return st.lessons[id]; }
  function finishCheck(id) {
    var l = L(id);
    if (!l.done && l.act && l.quiz && l.quiz.best / l.quiz.total >= 0.6) {
      l.done = today(); save(); addXP(25, 'Lesson complete'); return true;
    }
    return false;
  }
  function markActivity(id) { var l = L(id); if (l.act) return false; l.act = true; save(); addXP(20, 'Activity done'); finishCheck(id); return true; }
  function markQuiz(id, score, total) {
    var l = L(id); var prev = l.quiz ? l.quiz.best : 0;
    if (!l.quiz || score > l.quiz.best) { l.quiz = { best: score, total: total }; save(); }
    if (score > prev) addXP(10 * (score - prev), 'Quiz');
    finishCheck(id); checkBadges();
  }
  function markChallenge(id) { var l = L(id); if (l.ch) return false; l.ch = true; save(); addXP(30, 'Challenge Mode'); return true; }
  function markDaily() {
    var t = today();
    if (st.daily[t]) return false;
    st.daily[t] = true;
    var s = st.streak;
    if (s.last && dayDiff(s.last, t) === 1) s.count += 1; else if (s.last !== t) s.count = 1;
    s.last = t; s.best = Math.max(s.best || 0, s.count);
    save(); addXP(25, 'Daily Dojo'); return true;
  }
  function streakNow() { // a streak only counts if you trained today or yesterday
    var s = st.streak; if (!s.last) return 0;
    var d = dayDiff(s.last, today()); return d <= 1 ? s.count : 0;
  }
  function earnBelt(wid, score, total) {
    st.tests[wid] = { passed: true, score: score, total: total, at: today() };
    var first = !st.belts[wid];
    st.belts[wid] = today(); save();
    if (first) addXP(200, 'Belt earned');
    checkBadges(); return first;
  }
  function recordArcade(game, score, won) {
    var a = st.arcade[game] || (st.arcade[game] = { plays: 0, wins: 0, best: 0 });
    a.plays++; if (won) a.wins++; var best = score > a.best; if (best) a.best = score; save(); checkBadges(); return best;
  }

  // ---------- sound (off by default; WebAudio beeps, no files) ----------
  var actx = null;
  function sfx(kind) {
    if (!st.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var notes = { click: [660], good: [660, 880], bad: [300, 220], xp: [880, 1175], win: [523, 659, 784, 1047], step: [440] }[kind] || [600];
      notes.forEach(function (f, i) {
        var o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + i * 0.09;
        o.type = kind === 'bad' ? 'sawtooth' : 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
        o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + 0.18);
      });
    } catch (e) { /* audio unavailable */ }
  }
  function setSound(on) { st.sound = !!on; save(); refreshBar(); if (on) sfx('good'); }

  // ---------- UI: top bar, toasts ----------
  function refreshBar() {
    var bar = document.getElementById('dojo-bar'); if (!bar) return;
    var xp = $('.db-xp b', bar), sk = $('.db-streak b', bar), me = $('.db-me', bar), snd = $('.db-sound', bar);
    if (xp) xp.textContent = st.xp.toLocaleString();
    if (sk) sk.textContent = streakNow();
    if (me) me.innerHTML = '<span class="db-av" aria-hidden="true">' + esc(avatar()) + '</span><span class="db-nick">' + esc(nick()) + '</span>';
    if (snd) { snd.setAttribute('aria-pressed', st.sound ? 'true' : 'false'); snd.textContent = st.sound ? '🔊' : '🔇'; snd.setAttribute('aria-label', st.sound ? 'Sound on. Tap to mute.' : 'Sound off. Tap to turn on.'); }
  }
  function buildBar() {
    var bar = document.getElementById('dojo-bar'); if (!bar) return;
    bar.innerHTML =
      '<a class="db-home" href="' + ROOT + 'index.html" aria-label="Back to the Dojo map"><span aria-hidden="true">🏯</span> <span>Dojo</span></a>' +
      '<span class="db-me"></span>' +
      '<span class="db-pill db-xp" title="Experience points"><span aria-hidden="true">⭐</span> <b>0</b><span class="sr-only"> XP</span><span aria-hidden="true"> XP</span></span>' +
      '<a class="db-pill db-streak" href="' + ROOT + 'daily.html" title="Daily Dojo streak"><span aria-hidden="true">🔥</span> <b>0</b><span class="sr-only"> day streak</span></a>' +
      '<button type="button" class="db-sound" aria-pressed="false">🔇</button>';
    $('.db-sound', bar).addEventListener('click', function () { setSound(!st.sound); });
    refreshBar();
  }
  var toastBox;
  function toast(msg, kind) {
    if (!toastBox) {
      toastBox = document.createElement('div'); toastBox.className = 'toasts'; toastBox.setAttribute('role', 'status'); toastBox.setAttribute('aria-live', 'polite');
      document.body.appendChild(toastBox);
    }
    var t = document.createElement('div'); t.className = 'toast ' + (kind || ''); t.textContent = msg;
    toastBox.appendChild(t);
    setTimeout(function () { t.classList.add('out'); setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 400); }, 2600);
  }

  // Gentle falling confetti (no flashing). Skipped for reduced motion.
  function confetti(n) {
    if (reducedMotion()) return;
    var box = document.createElement('div'); box.className = 'confetti'; box.setAttribute('aria-hidden', 'true');
    var colors = ['#ff5d5d', '#ffd23f', '#3a86ff', '#2ec27e', '#8e44ec', '#ff8c42'];
    for (var i = 0; i < (n || 60); i++) {
      var p = document.createElement('i');
      p.style.left = (Math.random() * 100) + '%';
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = (Math.random() * 0.8) + 's';
      p.style.animationDuration = (2.4 + Math.random() * 1.6) + 's';
      p.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
      box.appendChild(p);
    }
    document.body.appendChild(box);
    setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 4800);
  }

  // ---------- Quiz engine ----------
  // q = { q: 'question', a: ['choice', ...], c: correctIndex, why: 'explanation', wrong: {index: 'specific hint'} }
  function quiz(el, qs, opts) {
    opts = opts || {};
    var T = opts.T || theme('quiz');
    var i = 0, score = 0;
    function sample() { return opts.count ? shuffle(qs).slice(0, opts.count) : qs; }
    var order = sample(), K = opts.saveKey;
    function persist() { if (K) saveSet(K, { i: i, score: score, order: order.map(function (q) { return qs.indexOf(q); }) }); }
    if (K) {
      var sv = saveGet(K);
      if (sv && sv.order && sv.order.every(function (k) { return qs[k]; }) && sv.i > 0 && sv.i < sv.order.length) {
        order = sv.order.map(function (k) { return qs[k]; }); i = sv.i; score = sv.score || 0; opts.resumed = true;
      }
    }
    function render() {
      if (i >= order.length) return finish();
      var q = order[i];
      var idx = q.a.map(function (_, k) { return k; });
      if (opts.shuffle !== false && !q.keep) idx = shuffle(idx);
      var dots = order.map(function (_, k) { return '<span class="qz-dot' + (k < i ? ' done' : k === i ? ' now' : '') + '"></span>'; }).join('');
      el.innerHTML =
        '<div class="qz-top"><span class="qz-count">Question ' + (i + 1) + ' of ' + order.length + '</span><span class="qz-dots" aria-hidden="true">' + dots + '</span></div>' +
        '<p class="qz-q" id="qz-q-' + i + '">' + fill(q.q, T) + '</p>' +
        '<div class="qz-choices" role="group" aria-labelledby="qz-q-' + i + '">' +
        idx.map(function (k) { return '<button type="button" class="qz-choice" data-k="' + k + '">' + fill(q.a[k], T) + '</button>'; }).join('') +
        '</div><div class="qz-feedback" aria-live="polite"></div>';
      $all('.qz-choice', el).forEach(function (b) { b.addEventListener('click', function () { pick(+b.getAttribute('data-k'), b); }); });
    }
    function pick(k, btn) {
      var q = order[i];
      $all('.qz-choice', el).forEach(function (b) { b.disabled = true; if (+b.getAttribute('data-k') === q.c) b.classList.add('right'); });
      var fb = $('.qz-feedback', el), ok = k === q.c;
      if (ok) { score++; sfx('good'); } else { btn.classList.add('wrong'); sfx('bad'); }
      i++; persist(); i--;
      var msg = ok ? ('<b>✅ Correct!</b> ' + fill(q.yes || q.why || '', T))
        : ('<b>❌ Not quite.</b> ' + fill((q.wrong && q.wrong[k]) || q.why || '', T));
      fb.className = 'qz-feedback ' + (ok ? 'ok' : 'no');
      fb.innerHTML = '<p>' + msg + '</p><button type="button" class="btn primary qz-next">' + (i + 1 < order.length ? 'Next question →' : 'See my score') + '</button>';
      var nx = $('.qz-next', el); nx.addEventListener('click', function () { i++; render(); var h = el.querySelector('.qz-q'); if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); } });
      nx.focus({ preventScroll: true });
    }
    function finish() {
      if (K) saveClear(K);
      var pass = score / order.length >= (opts.pass || 0.6);
      var stars = score === order.length ? '🌟🌟🌟' : pass ? '🌟🌟' : '🌟';
      el.innerHTML = '<div class="qz-end ' + (pass ? 'pass' : 'fail') + '"><div class="qz-stars" aria-hidden="true">' + stars + '</div>' +
        '<p class="qz-score">You got <b>' + score + ' / ' + order.length + '</b></p>' +
        '<p>' + (score === order.length ? 'Flawless! Your sensei is impressed.' : pass ? 'Nice work — you passed! Want to go for a perfect score?' : 'Every black belt was once a white belt who kept going. Try again — you’ve got this.') + '</p>' +
        '<button type="button" class="btn qz-retry">↻ ' + (score === order.length ? 'Play again' : 'Try again') + '</button></div>';
      $('.qz-retry', el).addEventListener('click', function () { i = 0; score = 0; if (opts.reshuffle) order = sample(); if (K) saveClear(K); render(); });
      if (score === order.length) confetti(40);
      if (opts.onDone) opts.onDone(score, order.length, pass);
    }
    render();
    if (opts.resumed) { var tp = el.querySelector('.qz-top'); if (tp) tp.insertAdjacentHTML('afterend', '<p class="qz-resume">💾 Welcome back! You were on question ' + (i + 1) + '.</p>'); }
    return { restart: function () { i = 0; score = 0; render(); } };
  }


  // ---------- Sorter: each item gets one choice; explanations; pass mark; autosave via api.save/load ----------
  // o = { items: [[html, answer, why?]], choices: [[value, label]], need: n, win: 'message', key: 'ans' }
  function sorter(el, api, o) {
    var key = o.key || 'ans', need = o.need || o.items.length;
    el.innerHTML = '<div class="so">' + o.items.map(function (it, i) {
      return '<div class="so-item" data-i="' + i + '"><p>' + it[0] + '</p><div class="row">' + o.choices.map(function (c) { return '<button type="button" class="btn small" data-v="' + c[0] + '">' + c[1] + '</button>'; }).join('') + '</div><div class="so-why" aria-live="polite"></div></div>';
    }).join('') + '</div><p class="feedback so-sum" aria-live="polite"></p>';
    var A = {}, n = 0, right = 0;
    function label(v) { for (var k = 0; k < o.choices.length; k++) if (String(o.choices[k][0]) === String(v)) return o.choices[k][1]; return v; }
    function pick(box, v, quiet) {
      var i = +box.getAttribute('data-i'), it = o.items[i];
      if (box.classList.contains('ok') || box.classList.contains('no')) return;
      var ok = String(v) === String(it[1]); n++; if (ok) right++;
      A[i] = v; if (api.save) { var sv = {}; sv[key] = A; api.save(sv); }
      box.classList.add(ok ? 'ok' : 'no');
      $all('button', box).forEach(function (b) { b.disabled = true; if (b.getAttribute('data-v') === String(it[1])) b.classList.add('so-right'); });
      $('.so-why', box).innerHTML = (ok ? '✅ ' : '❌ Best answer: <b>' + label(it[1]) + '</b>. ') + (it[2] || '');
      if (!quiet) sfx(ok ? 'good' : 'bad');
      if (n === o.items.length) {
        var sum = $('.so-sum', el);
        if (right >= need) { sum.className = 'feedback ok so-sum'; sum.innerHTML = right + '/' + o.items.length + ' — ' + (o.win || 'Nice work!'); if (api.done) api.done(); }
        else {
          sum.className = 'feedback no so-sum'; sum.innerHTML = right + '/' + o.items.length + '. You need ' + need + '. Read the explanations, then <button type="button" class="btn small so-again">try again</button>';
          $('.so-again', el).addEventListener('click', function () { if (api.save) { var z = {}; z[key] = {}; api.save(z); } sorter(el, api, o); });
        }
      }
    }
    $all('.so-item button', el).forEach(function (b) { b.addEventListener('click', function () { pick(b.closest('.so-item'), b.getAttribute('data-v')); }); });
    var saved = api.load ? (api.load()[key] || {}) : {};
    Object.keys(saved).forEach(function (i) { var box = $('.so-item[data-i="' + i + '"]', el); if (box) pick(box, saved[i], true); });
  }

  // ---------- Belt ceremony ----------
  function ceremony(w, onClose) {
    var ov = document.createElement('div'); ov.className = 'ceremony'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-labelledby', 'cer-title');
    ov.innerHTML = '<div class="cer-card">' +
      '<svg class="cer-belt" viewBox="0 0 240 120" aria-hidden="true"><defs><linearGradient id="cerg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="' + w.color + '"/><stop offset="1" stop-color="' + w.color + '" stop-opacity=".78"/></linearGradient></defs>' +
      '<path class="cer-l" d="M10 48 H110 V68 H10 Z" fill="url(#cerg)" stroke="#0003" stroke-width="2"/>' +
      '<path class="cer-r" d="M130 48 H230 V68 H130 Z" fill="url(#cerg)" stroke="#0003" stroke-width="2"/>' +
      '<rect class="cer-knot" x="104" y="42" width="32" height="32" rx="6" fill="url(#cerg)" stroke="#0004" stroke-width="2"/>' +
      '<path class="cer-tail1" d="M110 72 L92 112 L106 114 L120 76 Z" fill="url(#cerg)" stroke="#0003" stroke-width="2"/>' +
      '<path class="cer-tail2" d="M130 72 L148 112 L134 114 L120 76 Z" fill="url(#cerg)" stroke="#0003" stroke-width="2"/></svg>' +
      '<p class="cer-kicker">Belt Ceremony</p><h2 id="cer-title">' + STUDENT + ', you earned the ' + esc(w.name) + '!</h2>' +
      '<p class="cer-sub">' + esc(avatar() + ' ' + nick()) + ' bows to the sensei. The dojo cheers. <b>+200 XP</b></p>' +
      '<button type="button" class="btn primary cer-ok">Bow and continue 🙇</button></div>';
    document.body.appendChild(ov);
    sfx('win'); confetti(90);
    var ok = $('.cer-ok', ov); ok.focus();
    function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); document.removeEventListener('keydown', key); if (onClose) onClose(); }
    function key(e) { if (e.key === 'Escape') close(); }
    ok.addEventListener('click', close); document.addEventListener('keydown', key);
  }

  window.Dojo = {
    state: function () { return st; }, save: save, reset: reset, storageOK: storageOK,
    saveGet: saveGet, saveSet: saveSet, saveClear: saveClear, setLast: setLast,
    esc: esc, $: $, $all: $all, today: today, hash: hash, shuffle: shuffle, reducedMotion: reducedMotion,
    profile: profile, nick: nick, avatar: avatar, student: STUDENT, favs: favs, theme: theme, fill: fill,
    setProfile: function (p) { st.profile = p; save(); refreshBar(); },
    allLessons: allLessons, worldById: worldById, worldUnlocked: worldUnlocked, worldProgress: worldProgress,
    lessonDone: lessonDone, testReady: testReady, lessonHref: lessonHref, nextStep: nextStep, countDone: countDone, countBelts: countBelts,
    BADGES: BADGES, badgeCount: badgeCount, checkBadges: checkBadges,
    addXP: addXP, markActivity: markActivity, markQuiz: markQuiz, markChallenge: markChallenge, markDaily: markDaily,
    streakNow: streakNow, earnBelt: earnBelt, recordArcade: recordArcade,
    sfx: sfx, setSound: setSound, toast: toast, confetti: confetti, quiz: quiz, sorter: sorter, ceremony: ceremony, refreshBar: refreshBar,
    root: ROOT, C: C, page: P,
  };

  function boot() { buildBar(); checkBadges(true); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
<script>
window.DAILY_BANK=[{"from":"white/rules-vs-learning","q":"What’s the big difference between RuleBot and LearnBot?","a":["RuleBot follows rules a person wrote; LearnBot found a pattern in labeled examples","LearnBot is a robot and RuleBot is not","RuleBot is always wrong","LearnBot doesn’t need any examples"],"c":0,"why":"RuleBot only knows the exact rule you gave it. LearnBot built its own way of deciding from the examples you labeled."},{"from":"white/rules-vs-learning","q":"What would happen if you labeled lots of happy faces as grumpy while teaching LearnBot?","a":["LearnBot would learn the wrong pattern and make more mistakes","LearnBot would notice and fix your labels","Nothing — labels don’t matter","LearnBot would refuse to learn"],"c":0,"why":"A learning machine learns from the examples it gets — including the mistakes. Bad examples teach bad patterns."},{"from":"white/rules-vs-learning","q":"Which job is easiest to do with a simple rule?","a":["Turning minutes into seconds","Recognizing faces in photos","Understanding slang in messages","Guessing which song you’ll like next"],"c":0,"why":"Minutes × 60 = seconds, every single time. The others have too many messy details for simple rules."},{"from":"white/rules-vs-learning","q":"Why do face-recognition systems use machine learning instead of hand-written rules?","a":["Real faces have too many details and variations to write rules for all of them","Writing rules is against the law","Machine learning never makes mistakes","Computers can’t follow rules"],"c":0,"why":"Lighting, angles, glasses, hair… nobody can write a rule for every case. So we let the computer learn patterns from lots of examples. It still makes mistakes sometimes!"},{"from":"white/ai-all-around","q":"Which of these uses AI?","a":["A phone that unlocks when it recognizes your face","A light switch","A calculator","An alarm clock set for 7:00"],"c":0,"why":"Recognizing a face — from new angles, in different light — takes learned patterns. The others just follow fixed rules."},{"from":"white/ai-all-around","q":"How does a video app guess what you might like?","a":["It finds patterns in what you and similar viewers watched","It asks your friends","It picks totally at random","A person watches everything with you"],"c":0,"why":"Recommendation systems learn from what millions of people watched, liked and skipped, then predict what you’ll enjoy."},{"from":"white/ai-all-around","q":"Why isn’t a simple alarm clock AI?","a":["It follows one fixed rule — it doesn’t recognize, predict or learn anything","It’s too small","It doesn’t use electricity","AI can’t tell time"],"c":0,"why":"Being automatic isn’t the same as being intelligent. “Ring at 7:00” is a single rule."},{"from":"white/ai-all-around","q":"You type “basketball” and your keyboard suggests “practice”. What is it doing?","a":["Predicting a likely next word from patterns in lots of text","Reading your mind","Copying your friend’s messages","Guessing totally at random"],"c":0,"why":"It learned which words often come next. Chatbots use a much bigger version of the same idea!"},{"from":"white/is-it-ai","q":"A toy looks exactly like a robot, but it can only walk forward when you wind it up. Is it AI?","a":["No — looking like a robot doesn’t make something AI","Yes — all robots are AI","Yes — it moves by itself","Only if it has flashing lights"],"c":0,"why":"AI is about what a system can do — recognize, predict, decide, create — not what it looks like."},{"from":"white/is-it-ai","q":"Which clue BEST suggests something uses AI?","a":["It recognizes, predicts or decides using patterns learned from data","It uses electricity","It has a screen","It’s expensive"],"c":0,"why":"Lots of machines use electricity and screens. The AI clue is learned patterns used to recognize, predict, decide or create."},{"from":"white/is-it-ai","q":"Automatic doors open all by themselves. Why aren’t they usually called AI?","a":["They follow one simple rule: sensor detects motion → open","They’re too slow","They’re made of glass","Doors can never use AI"],"c":0,"why":"Automatic ≠ intelligent. A sensor plus one rule is automation, not AI."},{"from":"white/is-it-ai","q":"A company says its toaster is “AI-powered”. What should a smart thinker do?","a":["Ask what it actually recognizes, predicts or learns — a label alone doesn’t prove it","Believe it — companies are always right","Assume it’s dangerous","Throw the toaster away"],"c":0,"why":"“AI” is a popular marketing word. Ask what the product really does before you believe the label."},{"from":"white/al-khwarizmi","q":"Where does the word “algorithm” come from?","a":["The name of the scholar al-Khwarizmi","A type of robot","A Greek word for “computer”","A video game from the 1980s"],"c":0,"why":"When al-Khwarizmi’s book was translated into Latin, his name became “Algoritmi.” Over time that turned into “algorithm.”"},{"from":"white/al-khwarizmi","q":"What is an algorithm?","a":["A precise, step-by-step set of instructions for solving a problem","Any kind of robot","A computer screen","A lucky guess"],"c":0,"why":"Recipes, dance routines and the moves in your Algorithm Dojo are all algorithms: exact steps in order."},{"from":"white/al-khwarizmi","q":"Your ninja crashed into a rock on move 4. What’s the best thing to do?","a":["Find the step that went wrong and fix it — that’s debugging","Give up","Add random blocks until it works","Blame the computer"],"c":0,"why":"The computer did exactly what you said. Debugging means finding where the instructions went wrong and fixing them."},{"from":"white/al-khwarizmi","q":"Why is a repeat block useful?","a":["It makes programs shorter and easier to read when a step repeats","It makes the ninja run faster","It lets you skip testing","It picks moves at random"],"c":0,"why":"Programmers call this a loop. Loops are everywhere in real code."},{"from":"white/al-khwarizmi","q":"Which word ALSO comes from one of al-Khwarizmi’s books?","a":["Algebra","Robot","Pixel","Internet"],"c":0,"why":"His book on solving equations had “al-jabr” in its title, and that became “algebra.”"},{"from":"white/turing-test","q":"What is the Turing Test?","a":["A judge chats with a hidden human and a hidden machine and tries to tell which is which","A test of how fast a computer is","A math exam for robots","A chess game against a computer"],"c":0,"why":"Turing called it the “imitation game.” The question is whether the machine’s conversation can pass for a human’s."},{"from":"white/turing-test","q":"Who proposed it, and when?","a":["Alan Turing, in 1950","Al-Khwarizmi, about 1,200 years ago","A chatbot, in 2022","Nobody knows"],"c":0,"why":"Alan Turing described it in his 1950 paper “Computing Machinery and Intelligence.”"},{"from":"white/turing-test","q":"A chatbot fools a judge in a short chat. What does that prove?","a":["It can imitate human conversation — not that it understands or has feelings","It is alive","It is smarter than every human","It never makes mistakes"],"c":0,"why":"Imitating conversation is impressive, but it isn’t the same as understanding or feeling."},{"from":"white/turing-test","q":"Why was the instant answer to 38,427 × 9,613 a clue?","a":["Most people can’t multiply huge numbers instantly and perfectly","Humans can’t do math","Bots can’t do math","The answer was wrong"],"c":0,"why":"Superhuman speed can give a machine away. Being TOO perfect is a clue!"},{"from":"white/ai-myths","q":"Is every robot an AI?","a":["No — a robot is a machine body, and it may or may not use AI","Yes, always","Only if it can talk","Only if it’s made of metal"],"c":0,"why":"Robots are bodies; AI is software. A factory arm that repeats one motion isn’t AI, and a chatbot is AI with no body."},{"from":"white/ai-myths","q":"Why might an AI system be unfair?","a":["It learned from data that was unbalanced or unfair","AI is mean on purpose","Computers dislike people","AI can never be unfair"],"c":0,"why":"AI learns patterns from its data. If the data is unfair, the patterns can be too."},{"from":"white/ai-myths","q":"A headline says: “AI Is Now Smarter Than Humans At EVERYTHING!” This is…","a":["Hype — AI is great at some narrow tasks but struggles with many others","Totally true","A proven scientific fact","Impossible to judge"],"c":0,"why":"Watch for words like EVERYTHING, ALWAYS, NEVER. Real progress is impressive, but it’s narrower than hype suggests."},{"from":"white/ai-myths","q":"Which is TRUE about today’s AI?","a":["It can make up facts that sound true","It is always right","It has feelings like people","It doesn’t need any data"],"c":0,"why":"AI can be confidently wrong. That’s why fact-checking is a key AI skill."},{"from":"yellow/what-is-data","q":"What is data?","a":["Facts — numbers, words, pictures, sounds — collected so they can be studied","Only numbers","Only things stored on a computer","Secret information"],"c":0,"why":"Data can be almost any recorded fact: scores, photos, voice clips, words and more."},{"from":"yellow/what-is-data","q":"In a data table, each ROW is usually…","a":["One example (like one student)","One kind of fact","The title of the table","A mistake"],"c":0,"why":"Rows are examples; columns are features."},{"from":"yellow/what-is-data","q":"Which of these could be data for an AI?","a":["All of these: photos, voice recordings, game scores and text messages","Only numbers","Only photos","Nothing from real life"],"c":0,"why":"AI can learn from many kinds of data — that’s why face unlock, voice assistants and chatbots all exist."},{"from":"yellow/what-is-data","q":"“Belt color” is what kind of data?","a":["A category — one of a set of groups","A number you can average","A sound","An image"],"c":0,"why":"Categories are labels like colors or team names. You can count them, but you can’t average “Green” and “Blue.”"},{"from":"yellow/collect-and-label","q":"What is a label in machine learning?","a":["The correct answer attached to an example, like tagging a photo “bird”","A sticker on a computer","The name of the AI","A type of chart"],"c":0,"why":"Labels are the answers the AI learns from. Photo + label = a training example."},{"from":"yellow/collect-and-label","q":"If many dolphins were labeled “fish,” what might the AI learn?","a":["A false pattern like “anything that swims is a fish”","Nothing — it would ignore them","It would fix the labels automatically","It would learn faster"],"c":0,"why":"AI copies the patterns in its labels, including the mistakes."},{"from":"yellow/collect-and-label","q":"Why do real AI teams often have several people label the same item?","a":["To catch mistakes and disagreements, so labels are more accurate","Because labeling is too easy","To make the dataset smaller","It’s a rule of computers"],"c":0,"why":"When labelers disagree, it flags a tricky or unclear example to double-check."},{"from":"yellow/collect-and-label","q":"You only collect data about favorite sports at a basketball camp. What’s the problem?","a":["The sample is biased — it doesn’t represent all kids","Nothing, that’s perfect data","Basketball data can’t be collected","The data is too colorful"],"c":0,"why":"Where you collect data matters. A basketball camp will over-represent basketball fans."},{"from":"yellow/stats-court","q":"Why do analysts turn tables of numbers into charts?","a":["Charts turn numbers into shapes, so patterns are easier to see quickly","Charts change the data","Tables are always wrong","Charts are only for decoration"],"c":0,"why":"A chart shows the same data, just in a form your eyes can compare fast."},{"from":"yellow/stats-court","q":"In the Points chart, how could you tell who scored the most?","a":["Their bar was the longest","Their name was first alphabetically","Their bar was the shortest","You couldn’t tell"],"c":0,"why":"In a bar chart, bar length shows the size of the value."},{"from":"yellow/stats-court","q":"Players who play more minutes tend to score more points. This is called…","a":["A positive correlation","An algorithm","A label","A random guess"],"c":0,"why":"When two things tend to rise together, they are positively correlated."},{"from":"yellow/stats-court","q":"Hawk has the most assists but isn’t a top scorer. What does this show?","a":["Different stats measure different skills — one number doesn’t tell the whole story","Hawk is a bad player","Assists don’t matter","The chart is broken"],"c":0,"why":"Good analysts look at many features, not just one."},{"from":"yellow/averages-and-patterns","q":"What is the average (mean) of 4, 6 and 8?","a":["6","18","8","4"],"c":0,"why":"4 + 6 + 8 = 18, and 18 ÷ 3 = 6."},{"from":"yellow/averages-and-patterns","q":"You made 8, 8, 8, 8 and then 48 shots. What happens to the average?","a":["One extreme value pulls it up a lot","It stays 8","It goes down","Averages ignore big numbers"],"c":0,"why":"(8+8+8+8+48) ÷ 5 = 16, double the “usual” day. Extreme values tug the average."},{"from":"yellow/averages-and-patterns","q":"Where is the average on a “seesaw” of data points?","a":["Exactly at the balance point","Always at the far left","At the biggest number","Nowhere"],"c":0,"why":"The mean is the point where values on each side balance out."},{"from":"yellow/averages-and-patterns","q":"Why do AI systems care about patterns?","a":["Patterns let them make predictions about new situations","Patterns make data prettier","They don’t care about patterns","Patterns delete bad data"],"c":0,"why":"Learning = finding patterns in examples, then using them to predict."},{"from":"yellow/garbage-in-garbage-out","q":"What does “garbage in, garbage out” mean?","a":["If the data going in is bad, the results coming out will be bad","Computers eat trash","Always delete your data","AI cleans garbage automatically"],"c":0,"why":"An AI can only be as good as the data it learns from."},{"from":"yellow/garbage-in-garbage-out","q":"Why did the banana AI make mistakes before you cleaned the data?","a":["Wrong labels and a shoe photo pulled its “ripe” line to the wrong place","Bananas are impossible to sort","The AI was lazy","There were too many good examples"],"c":0,"why":"The mislabeled examples shifted where the AI drew the line between ripe and not ripe."},{"from":"yellow/garbage-in-garbage-out","q":"Which is an example of “garbage” training data?","a":["A cat photo labeled “dog”","A clear dog photo labeled “dog”","A lot of correctly labeled photos","A photo taken in good light"],"c":0,"why":"Wrong labels teach the wrong pattern."},{"from":"yellow/garbage-in-garbage-out","q":"What’s a data scientist’s job before training an AI?","a":["Check and clean the data","Delete half the data at random","Add random photos","Nothing — just train it"],"c":0,"why":"Data scientists often spend MORE time cleaning data than building models!"},{"from":"yellow/data-detective","q":"What is an outlier?","a":["A data point very different from the rest","Any number bigger than 10","A missing value","The average"],"c":0,"why":"Outliers stand out. They might be mistakes, or real and important."},{"from":"yellow/data-detective","q":"Friday had 21,500 steps — tournament day. What should you do with it?","a":["Keep it — it’s real, and note why it’s unusual","Delete it because it’s big","Change it to 8,000","Delete the whole week"],"c":0,"why":"Deleting real data hides the truth. Investigate before removing anything."},{"from":"yellow/data-detective","q":"Why is a duplicate row a problem?","a":["It counts the same thing twice, skewing totals and averages","Duplicates make data prettier","It isn’t a problem","It deletes other rows"],"c":0,"why":"Double-counting makes that day look twice as important as it was."},{"from":"yellow/data-detective","q":"Sleep = 90 hours in one day. How do you know it’s a mistake?","a":["It’s impossible — a day only has 24 hours","It’s too small","Sleep can’t be measured","It’s on a Thursday"],"c":0,"why":"Checking whether a value is even possible is a data detective’s first move."},{"from":"orange/train-a-classifier","q":"What does a classifier do?","a":["Sorts things into groups (classes)","Draws pictures","Makes sounds","Deletes data"],"c":0,"why":"Spam vs not spam, crystal vs plain: that’s classification."},{"from":"orange/train-a-classifier","q":"What were the two features the rover measured?","a":["Shine and size","Color and smell","Weight and price","Name and age"],"c":0,"why":"Features are the measurements a model uses to decide."},{"from":"orange/train-a-classifier","q":"Why did the decision line run mostly up and down?","a":["Because shine separated the classes, while size didn’t matter","Because it’s always vertical","Because size was the key feature","It was random"],"c":0,"why":"The line separates the classes along the feature that actually differs between them: shine."},{"from":"orange/train-a-classifier","q":"What happens to the decision line if you sort some rocks into the wrong basket?","a":["It moves to the wrong place, and the rover makes more mistakes","Nothing changes","It becomes perfect","The rover refuses to learn"],"c":0,"why":"The line is learned from your labels. Wrong labels → wrong line."},{"from":"orange/train-vs-test","q":"What is the test set for?","a":["Checking how well a model works on examples it has never seen","Training the model faster","Storing extra labels","Making the data bigger"],"c":0,"why":"The test set is a surprise exam. The model never learns from it."},{"from":"orange/train-vs-test","q":"A model scores 100% when tested on its own training data. What does that prove?","a":["Not much — it may have just memorized those examples","It is perfect","It will never make mistakes","The test set is useless"],"c":0,"why":"You can’t judge learning with questions the model already saw."},{"from":"orange/train-vs-test","q":"Why should the test pile include BOTH spam and real emails?","a":["So it checks the model’s skill on both classes","To make it longer","It doesn’t matter","Real emails can’t be tested"],"c":0,"why":"A test with only one class can’t show whether the model handles the other."},{"from":"orange/train-vs-test","q":"Most of the data usually goes to…","a":["Training — the model needs lots of examples to learn from","Testing","The trash","Neither"],"c":0,"why":"A common split is roughly 80% training and 20% testing."},{"from":"orange/accuracy-score","q":"A model gets 45 out of 50 right. What is its accuracy?","a":["90%","45%","50%","95%"],"c":0,"why":"45 ÷ 50 = 0.9 = 90%."},{"from":"orange/accuracy-score","q":"Only 5 of 100 emails are spam. A model that ALWAYS says “not spam” scores…","a":["95% accuracy, while catching zero spam","0% accuracy","5% accuracy","100% accuracy"],"c":0,"why":"High accuracy can hide total failure on the rare class."},{"from":"orange/accuracy-score","q":"Why can accuracy be misleading?","a":["When one class is rare, a model can score high while missing the important cases","Accuracy is always wrong","Accuracy can’t be calculated","It only works for images"],"c":0,"why":"Always ask: accurate at WHAT?"},{"from":"orange/accuracy-score","q":"Who decides which mistakes matter most for an AI in a hospital?","a":["People — doctors, patients and engineers — based on what’s at stake","The AI decides by itself","Nobody","The computer’s manufacturer"],"c":0,"why":"Choosing what counts as “good enough” is a human decision."},{"from":"orange/overfitting","q":"What is overfitting?","a":["When a model memorizes its training data so closely that it fails on new data","When a model is too small to run","When data is missing","When a model is perfect"],"c":0,"why":"Overfitting = memorizing instead of understanding."},{"from":"orange/overfitting","q":"The super-wiggly curve had ZERO training mistakes. Why was that bad?","a":["It memorized the random noise, so it made big mistakes on new points","Zero mistakes is always good","It was too slow","It used the wrong colors"],"c":0,"why":"Perfect on training data + terrible on test data = overfitting."},{"from":"orange/overfitting","q":"How can engineers catch overfitting?","a":["Compare the training score with the test score on hidden data","Only look at the training score","Make the model more wiggly","Delete the test set"],"c":0,"why":"A big gap between training and test scores is the warning sign."},{"from":"orange/overfitting","q":"A straight line that can’t follow the curve at all is…","a":["Underfitting — too simple","Overfitting","Perfect","A data leak"],"c":0,"why":"Too simple = underfit. Too complex = overfit. The goal is the sweet spot."},{"from":"orange/decision-trees","q":"What is a decision tree?","a":["A model that decides by asking a series of yes/no questions","A real tree with sensors","A list of random guesses","A type of chart"],"c":0,"why":"Each question splits the data until a decision (a leaf) is reached."},{"from":"orange/decision-trees","q":"Which question was most useless for predicting outdoor training?","a":["Is it Monday?","Is it raining?","Is it windy?","All were equally useful"],"c":0,"why":"The day of the week had nothing to do with the outcome."},{"from":"orange/decision-trees","q":"What is a “leaf” in a decision tree?","a":["The end of a branch, where the tree gives its answer","The first question","A bug","A missing value"],"c":0,"why":"Questions are branches; answers are leaves."},{"from":"orange/decision-trees","q":"Why do people like decision trees?","a":["You can read them and see exactly WHY the model decided","They never make mistakes","They don’t need data","They only work outdoors"],"c":0,"why":"Trees are “explainable”: you can follow each step. Many AI models are much harder to explain."},{"from":"orange/nearest-neighbor","q":"How does nearest neighbor label a new example?","a":["It copies the label of the most similar known examples","It picks a random label","It asks a human every time","It always says the most common label"],"c":0,"why":"Similar examples usually share a label."},{"from":"orange/nearest-neighbor","q":"What does k mean in k-nearest neighbors?","a":["How many nearby examples get to vote","How many features there are","The speed of the computer","The number of classes"],"c":0,"why":"k = 1: the single closest decides. k = 5: the five closest vote."},{"from":"orange/nearest-neighbor","q":"A striker who makes lots of tackles sits among the defenders. With k = 1, a new player right next to them is labeled…","a":["Striker, even though most neighbors are defenders","Defender, always","Both","Nothing"],"c":0,"why":"With k = 1, one unusual example decides alone."},{"from":"orange/nearest-neighbor","q":"What did the two axes on the map stand for?","a":["Two features: shots and tackles per game","Time and date","Name and age","Color and size"],"c":0,"why":"Each feature becomes a direction on the map. Distance = how different two players are."},{"from":"green/meet-the-neuron","q":"What are the three steps an artificial neuron follows?","a":["Take inputs → multiply by weights and add → fire if the total is big enough","See → hear → smell","Guess → give up → restart","Store → delete → print"],"c":0,"why":"Multiply, add, decide. That’s the whole neuron!"},{"from":"green/meet-the-neuron","q":"What does a weight tell you?","a":["How much an input matters","How heavy the computer is","The color of the input","The final answer"],"c":0,"why":"Bigger weight = bigger influence on the total."},{"from":"green/meet-the-neuron","q":"Friend (weight 2) + sunny (weight 1) are ON; homework (weight 3) is OFF. The total is…","a":["3","6","4","0"],"c":0,"why":"1×2 + 1×1 + 0×3 = 3."},{"from":"green/meet-the-neuron","q":"How are artificial neurons related to brain neurons?","a":["Loosely inspired by them, but much simpler math","They are exactly the same","They are made of real brain cells","No connection at all"],"c":0,"why":"The idea came from biology, but an artificial neuron is just arithmetic."},{"from":"green/weights-and-bias","q":"In the playground, what did changing the weights do to the line?","a":["Turned and tilted it","Changed its color","Deleted points","Nothing"],"c":0,"why":"Weights control the line’s direction."},{"from":"green/weights-and-bias","q":"What did the bias do?","a":["Slid the line without turning it","Made the line curvy","Added more points","Changed the labels"],"c":0,"why":"Bias shifts the line, like moving a starting line."},{"from":"green/weights-and-bias","q":"What does “training” an AI mostly mean?","a":["Automatically finding good values for weights and biases","Teaching it to exercise","Adding more colors","Deleting the data"],"c":0,"why":"Training = tuning millions of weights and biases so the model makes fewer mistakes."},{"from":"green/weights-and-bias","q":"Big AI models can have…","a":["Billions of weights","Exactly three weights","No weights","Only biases"],"c":0,"why":"Large language models have billions of adjustable numbers."},{"from":"green/activation-switch","q":"What does an activation function do?","a":["Turns a neuron’s total into its output","Turns the computer on","Adds more data","Labels the examples"],"c":0,"why":"Total in → activation rule → output."},{"from":"green/activation-switch","q":"ReLU gets a total of −3. What does it output?","a":["0","−3","3","1"],"c":0,"why":"ReLU turns every negative into 0."},{"from":"green/activation-switch","q":"ReLU gets a total of 4. What does it output?","a":["4","0","1","−4"],"c":0,"why":"Positive totals pass straight through."},{"from":"green/activation-switch","q":"Which activation squeezes any number into a smooth value between 0 and 1?","a":["Sigmoid","ReLU","Step","None"],"c":0,"why":"Sigmoid is the smooth S-curve."},{"from":"green/network-playground","q":"What is a neural network?","a":["Many artificial neurons connected in layers","A computer network for games","A single neuron","A type of spreadsheet"],"c":0,"why":"Neurons in layers pass numbers forward, each layer building on the last."},{"from":"green/network-playground","q":"Why couldn’t ONE neuron solve the pass alarm (XOR)?","a":["One neuron can only draw one straight line, and XOR needs more than that","It was too slow","It had no bias","XOR is unsolvable by any computer"],"c":0,"why":"Combining several neurons can carve out shapes one line can’t."},{"from":"green/network-playground","q":"What does the hidden layer do?","a":["Finds simpler patterns that later layers combine","Hides the answer from you","Stores passwords","Nothing"],"c":0,"why":"Hidden neurons are the network’s middle steps."},{"from":"green/network-playground","q":"In a big image AI, early layers often detect edges. What might later layers detect?","a":["Bigger shapes and whole objects, like eyes or wheels","Nothing new","Only colors","Sounds"],"c":0,"why":"Layer by layer: edges → shapes → objects. You’ll see this in the Blue Belt!"},{"from":"green/walking-downhill","q":"In gradient descent, what is the “mountain”?","a":["The model’s error (how wrong it is)","A real mountain","The computer screen","The dataset size"],"c":0,"why":"Going downhill = making the error smaller."},{"from":"green/walking-downhill","q":"What does each step downhill do to the model?","a":["Tweaks its weights so it’s a little less wrong","Deletes data","Makes it bigger","Adds new labels"],"c":0,"why":"Each step adjusts the weights in the direction that lowers the error."},{"from":"green/walking-downhill","q":"What happened with a HUGE step size?","a":["It overshot the valley and the error got worse","It reached the bottom instantly every time","Nothing moved","The mountain disappeared"],"c":0,"why":"Too big a learning rate jumps right over the bottom."},{"from":"green/walking-downhill","q":"What happened with a TINY step size?","a":["It moved in the right direction, but very slowly","It overshot","It went uphill","It stopped immediately"],"c":0,"why":"Tiny steps are safe but slow."},{"from":"green/how-networks-learn","q":"What are the steps of the training loop, in order?","a":["Predict → measure the loss → nudge the weights → repeat","Nudge → delete → predict → stop","Measure → give up → restart","Repeat → predict → guess → print"],"c":0,"why":"This loop runs over and over until the loss is low enough."},{"from":"green/how-networks-learn","q":"What is the loss?","a":["A score of how wrong the model’s predictions are","The number of weights","Lost data","The model’s speed"],"c":0,"why":"Training tries to make the loss smaller."},{"from":"green/how-networks-learn","q":"As training went on, what happened to the loss chart?","a":["It went down — the neuron got less wrong","It went up forever","It stayed flat","It disappeared"],"c":0,"why":"Each loop nudged the weights downhill."},{"from":"green/how-networks-learn","q":"All 10 points were correct, but training still lowered the loss. Why?","a":["The neuron became more confident in its correct answers","It started getting answers wrong","Loss is random","The points moved"],"c":0,"why":"Loss rewards being right AND sure. That’s why it kept dropping."},{"from":"blue/pixels","q":"What is a pixel?","a":["One tiny square of color in a digital image","A type of camera","A small robot","A computer virus"],"c":0,"why":"Images are grids of pixels."},{"from":"blue/pixels","q":"How does a computer store a pixel’s color?","a":["As numbers","As paint","As a sound","It can’t store color"],"c":0,"why":"Usually three numbers: red, green and blue."},{"from":"blue/pixels","q":"When AI “looks” at a photo, what is it really working with?","a":["A big grid of numbers","The real object","Feelings","Words only"],"c":0,"why":"Computer vision is math on pixel numbers."},{"from":"blue/pixels","q":"An image is 10 × 10 pixels with 3 color numbers each. How many numbers in total?","a":["300","100","30","13"],"c":0,"why":"10 × 10 = 100 pixels × 3 = 300."},{"from":"blue/color-numbers","q":"What do the letters RGB stand for?","a":["Red, Green, Blue","Really Good Brightness","Rainbow, Gold, Black","Robot, Game, Bot"],"c":0,"why":"Screens mix red, green and blue light."},{"from":"blue/color-numbers","q":"What color is ":["It compared your dots with stored templates and picked the closest match","It guessed randomly","It read your mind","It asked another person"],"c":0,"why":"Closest match wins. That’s pattern matching."},{"from":"blue/draw-and-guess","q":"Why might a messy or tiny drawing fool it?","a":["It no longer looks much like any stored template","Computers dislike messy drawings","Tiny drawings are invisible","It never gets fooled"],"c":0,"why":"Simple template matching struggles with shapes it doesn’t expect."},{"from":"blue/draw-and-guess","q":"How do big drawing-recognition AIs get better at messy doodles?","a":["They train neural networks on millions of real drawings","They use bigger screens","They only accept neat drawings","They have no data"],"c":0,"why":"More varied examples = better at the messiness of real life."},{"from":"blue/sound-to-numbers","q":"What is sampling?","a":["Measuring a sound wave many times per second and storing each measurement as a number","Tasting food","Deleting sounds","Recording video"],"c":0,"why":"Each sample is one number."},{"from":"blue/sound-to-numbers","q":"A higher-pitched sound has…","a":["More waves squeezed into the same time","Taller waves","No waves","Fewer samples"],"c":0,"why":"Pitch = how fast the wave wiggles (frequency)."},{"from":"blue/sound-to-numbers","q":"A louder sound has…","a":["Taller waves","More waves per second","Fewer numbers","A different color"],"c":0,"why":"Loudness = wave height (amplitude)."},{"from":"blue/sound-to-numbers","q":"How many samples per second does CD audio use for each speaker?","a":["44,100","10","1 million","12"],"c":0,"why":"44,100 samples per second, which captures sounds up to about 22,000 waves per second."},{"from":"blue/how-ai-sees","q":"What do the EARLY layers of an image network usually detect?","a":["Simple features like edges","Whole objects","Names of objects","Sounds"],"c":0,"why":"Early layers find edges and simple textures."},{"from":"blue/how-ai-sees","q":"What do LATER
